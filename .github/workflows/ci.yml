name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out Omarchy UI for layout tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: omacom/omarchy
          ref: e332dc975d5f635294c497ebb54feb98dc3d89eb
          path: .test-omarchy
          sparse-checkout: |
            shell/Ui
            shell/Commons

      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap iproute2 jq lua5.4 mpv python3 ripgrep socat \
            python3-dbus python3-gi pipewire pipewire-pulse wireplumber pulseaudio-utils \
            dbus-x11 libglib2.0-bin
          sudo apt-get install --yes qt6-declarative-dev-tools qml6-module-qttest \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript \
            qml6-module-qtqml-models qml6-module-qtquick-layouts \
            qml6-module-qtquick-controls qml6-module-qtquick-templates qml6-module-qtquick-shapes

      - name: Allow Bubblewrap network namespace setup
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Ubuntu's child profile denies CAP_NET_ADMIN needed to bring loopback up.
          sudo apparmor_parser --remove /etc/apparmor.d/bwrap-userns-restrict

      - name: Run tests
        env:
          OMARCHY_SHELL_DIR: ${{ github.workspace }}/.test-omarchy/shell
        run: python3 tests/headless.test.py

      - name: Verify audio output recovery
        run: python3 tests/audio-output.test.py --require-dependencies
