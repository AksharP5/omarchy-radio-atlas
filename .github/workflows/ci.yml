name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap iproute2 jq lua5.4 mpv python3 ripgrep socat
          sudo apt-get install --yes qt6-declarative-dev-tools qml6-module-qttest \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript \
            qml6-module-qtqml-models

      - name: Allow Bubblewrap user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Diagnose namespace capabilities
        run: |
          bwrap --version
          ip -Version
          sysctl -a 2>/dev/null | rg 'apparmor|unprivileged_userns'
          bwrap --unshare-net --unshare-pid --die-with-parent --cap-add CAP_NET_ADMIN \
            --bind / / --dev-bind /dev /dev -- /usr/bin/bash --noprofile --norc -c '
              id
              cat /proc/self/attr/current
              rg "Cap|NoNewPrivs|Seccomp" /proc/self/status
              ip link set lo up
            ' || true
          sudo dmesg | tail -n 60

      - name: Run tests
        run: ./tests/run
